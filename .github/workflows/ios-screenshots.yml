name: iOS screenshot capture

# Cloud-Mac capture pipeline. Boots an iOS simulator on a GitHub-hosted macOS
# runner, installs an EAS *simulator* build (no Apple credentials needed),
# signs in as a throwaway demo account, and captures App Store screenshots.

on:
  workflow_dispatch:
    inputs:
      build_url:
        description: Signed URL of the EAS simulator .tar.gz artifact
        required: true
      email:
        description: Demo account to sign in as
        required: true
        default: demo1@nomadalingo.invalid
      chat_id:
        description: Conversation id to capture for the chat screen
        required: true
        default: 714da45e-0699-4be0-b00a-870c14246618

permissions:
  contents: read

env:
  SUPABASE_URL: https://ccbxqpsxfgqqrwpkofba.supabase.co
  # Publishable key: already embedded in the shipped app bundle and web build.
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_qts6tQjEx7zkz0ItPdE1sg_tu97ayJ9
  BUNDLE_ID: com.ernestoho.nomadalingo

jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and unpack simulator build
        run: |
          set -euo pipefail
          mkdir -p build
          curl -fsSL -o build/app.tar.gz "${{ inputs.build_url }}"
          tar -xzf build/app.tar.gz -C build
          APP=$(find build -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "No .app bundle found in artifact"
            ls -la build
            exit 1
          fi
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"
          echo "Found bundle: $APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"

      - name: Boot iPhone 17 Pro Max simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available | grep "iPhone 17 Pro Max" | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$UDID" ]; then
            echo "No iPhone 17 Pro Max simulator available"
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Network probe
        continue-on-error: true
        run: |
          set -x
          curl -sS -o /dev/null -w "host_tcp=%{http_code} time=%{time_total}\n" \
            "$SUPABASE_URL/rest/v1/" || echo "host request failed"

      - name: Install and first launch
        run: |
          set -euo pipefail
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP_PATH"
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" "$BUNDLE_ID"
          sleep 6

      - name: Install Maestro
        run: |
          set -euo pipefail
          java -version
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Mint one-time code for demo account
        id: otp
        run: |
          set -euo pipefail
          RESPONSE=$(curl -fsS "$SUPABASE_URL/functions/v1/screenshot-login-temp?email=${{ inputs.email }}" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY")
          OTP=$(printf '%s' "$RESPONSE" | node -e '
            let raw = "";
            process.stdin.on("data", (chunk) => { raw += chunk; });
            process.stdin.on("end", () => {
              let parsed;
              try { parsed = JSON.parse(raw); } catch (err) {
                console.error("Unparseable response:", raw);
                process.exit(1);
              }
              if (!parsed.otp) {
                console.error("No OTP in response:", JSON.stringify(parsed));
                process.exit(1);
              }
              process.stdout.write(String(parsed.otp));
            });
          ')
          echo "::add-mask::$OTP"
          echo "otp=$OTP" >> "$GITHUB_OUTPUT"
          echo "Minted a code of length ${#OTP}"

      - name: Sign in with Maestro
        run: |
          set -euo pipefail
          DEEP_LINK="nomadalingo://verify?email=${{ inputs.email }}"
          maestro test \
            -e DEEP_LINK="$DEEP_LINK" \
            -e OTP="${{ steps.otp.outputs.otp }}" \
            .maestro/capture.yaml

      - name: Collect screenshots
        if: always()
        run: |
          set -euo pipefail
          mkdir -p shots
          find "$HOME/.maestro/tests" -name "*.png" -exec cp {} shots/ \; 2>/dev/null || true
          find . -maxdepth 1 -name "*.png" -exec cp {} shots/ \; 2>/dev/null || true
          ls -la shots
          for f in shots/*.png; do
            [ -e "$f" ] || continue
            printf '%-24s ' "$(basename "$f")"
            sips -g pixelWidth -g pixelHeight "$f" | tail -2 | tr -d '\n' | sed 's/  */ /g'
            echo
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: shots
          if-no-files-found: warn

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics
          path: |
            shots
            ~/.maestro/tests
          if-no-files-found: warn
