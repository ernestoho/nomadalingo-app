appId: com.ernestoho.nomadalingo
---
# The workflow has already launched the app and handed it the deep link with
# `simctl openurl` (which avoids the iOS "Open in ...?" confirmation dialog).
# So this flow starts on the verify screen; there is no launchApp/openLink.
- extendedWaitUntil:
    visible: "Código de acceso"
    timeout: 20000
- tapOn: "000000"
- inputText: "${OTP}"
# No hideKeyboard: it is unreliable on the iOS simulator. AppScreen uses a
# KeyboardAvoidingView, so "Continuar" is lifted above the software keyboard.
- tapOn: "Continuar"

# Retry tolerance: a failed attempt leaves "Continuar" visible again, and the
# OTP stays valid because a failed request never reached the server.
- extendedWaitUntil:
    notVisible: "Verificando…"
    timeout: 40000
- runFlow:
    when:
      visible: "Continuar"
    commands:
      - tapOn: "Continuar"
      - extendedWaitUntil:
          notVisible: "Verificando…"
          timeout: 40000
- runFlow:
    when:
      visible: "Continuar"
    commands:
      - tapOn: "Continuar"

# After a successful verify the route guard sends an already-onboarded profile
# to the tab navigator, whose first tab is "Inicio".
- extendedWaitUntil:
    visible: "Inicio"
    timeout: 40000
