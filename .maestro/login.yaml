appId: com.ernestoho.nomadalingo
---
# Signs in as a throwaway demo account by deep-linking straight to the verify
# screen, deliberately bypassing "Recibir código". Calling signInWithOtp would
# mint a *new* code and invalidate the one the workflow already fetched.
- launchApp:
    clearState: true
- openLink: "${DEEP_LINK}"
# iOS shows a system "Open in ...?" confirmation for custom schemes; the app is
# only launched once this is accepted.
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Código de acceso"
    timeout: 25000
- tapOn: "000000"
- inputText: "${OTP}"
# No hideKeyboard: it is unreliable on the iOS simulator. AppScreen uses a
# KeyboardAvoidingView, so "Continuar" is lifted above the software keyboard.
- tapOn: "Continuar"
# Home screen copy, used because the guard redirects an onboarded profile here.
# The generous timeout covers the in-app retries when the first verify request
# dies in transit.
- extendedWaitUntil:
    visible: "Conoce a la comunidad"
    timeout: 120000
- waitForAnimationToEnd
