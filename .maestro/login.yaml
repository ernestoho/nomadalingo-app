appId: com.ernestoho.nomadalingo
---
# Signs in as a throwaway demo account by deep-linking straight to the verify
# screen, deliberately bypassing "Recibir código". Calling signInWithOtp would
# mint a *new* code and invalidate the one the workflow already fetched.
- launchApp:
    clearState: true
# DEEP_LINK is passed whole from the workflow so no interpolation happens inside
# the URL string.
- openLink: "${DEEP_LINK}"
# iOS shows a system "Open in ...?" confirmation for custom schemes.
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Código de acceso"
    timeout: 20000
- tapOn: "000000"
- inputText: "${OTP}"
- hideKeyboard
- tapOn: "Continuar"
# After a successful verify the route guard sends an already-onboarded profile
# to the tab navigator, whose first tab is "Inicio".
- extendedWaitUntil:
    visible: "Inicio"
    timeout: 30000
