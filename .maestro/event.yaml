appId: com.ernestoho.nomadalingo
---
# Opens the first event card so the event detail screen can be captured.
# The card is a single flattened accessibility element (its label is the event
# title), so there is no inner text node to target and tapping by label does
# not register the press. A point inside the card is deterministic for the
# seeded data: the first card occupies the top third of the list.
- tapOn:
    point: "50%,25%"
- waitForAnimationToEnd
# "El plan" only exists on the event detail screen.
- assertVisible: "El plan"
